expname: "default"

data:
  batch_size: 128
  quantile: 31
  rand_seed: 0
  trainval_size: -1
  fold_ix: 0

model:
  num_classes: ${data.quantile}
  transform: true
  mode: 0

optimizer:
  name: "sgd"

logging:
  log_dir: "logs"
  checkpoint_dir: "checkpoints"
  on_step: false
  on_epoch: true
  prog_bar: true
  logger: true

trainer:
  limit_train_batches: 1000
  limit_val_batches: 100
  max_epochs: 1000
  lr: 0.001

hydra:
  run:
    dir: "../../data/hydralogs/"
